name: MoonBit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MOON_REGISTRY_API: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned MoonBit with checksum verification
        shell: bash
        run: |
          python tools/install_toolchain.py "$RUNNER_TEMP/moonpv-moon"
          echo "MOON_HOME=$RUNNER_TEMP/moonpv-moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moonpv-moon/bin" >> "$GITHUB_PATH"
      - name: Check, test, and build
        shell: bash
        run: |
          moon version --all
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti'
          moon check --target native --deny-warn
          moon test --target native --deny-warn
          moon build --target native --release --deny-warn
      - name: Exercise CLI against local TCP fixtures
        run: python tools/test_integration.py
      - name: Compare with SunSpec reference client
        shell: bash
        run: |
          python -m pip install -r tools/requirements-reference.txt
          python tools/test_reference.py
      - name: Run the documented offline demo
        run: python tools/demo.py --no-build
      - name: Build and verify the standalone distribution
        shell: bash
        run: |
          python tools/package_release.py --require-clean
          python tools/check_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: moonpv-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
